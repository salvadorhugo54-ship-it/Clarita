<style>

@media(min-width:800px){#app{padding-left:210px}nav{top:0;bottom:auto;right:auto;width:210px;flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding:16px 10px}nav .logo{display:block;font-weight:800;font-size:18px;margin:0 8px 16px}nav button{flex:none;flex-direction:row;gap:10px;font-size:15px;padding:11px 12px;border-radius:10px}nav button.on{background:var(--acs)}main{padding-bottom:100px}.fab{bottom:24px;right:24px}}

</style></head><body>
<div id="app"><nav id="nav"></nav><main id="main"></main></div>
<button class="fab" id="fab">＋ Agregar movimiento</button>
<div class="ov" id="modal" hidden></div><input type="file" id="imf" accept=".json,application/json" hidden>
<script>
const $=s=>document.querySelector(s),KEY='finanzas_usd_v1';
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'],MC=MES.map(m=>m.slice(0,3));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const fmt=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);
const r2=n=>Math.round(n*100)/100,pct=(a,t)=>t>0?(a/t*100).toFixed(1)+'%':'0.0%',uid=()=>Math.random().toString(36).slice(2,10);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const shift=(ym,d)=>{let[y,m]=ym.split('-').map(Number);m+=d;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+'-'+String(m).padStart(2,'0')};
const lastDay=ym=>new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();
const seed=()=>({accounts:[{id:'a1',name:'Efectivo',icon:'💵',initial:0},{id:'a2',name:'Cuenta bancaria',icon:'🏦',initial:0},{id:'a3',name:'Ahorro',icon:'🐷',initial:0}],
categories:[['Salario','income','💼','#16a34a'],['Ingresos extra','income','✨','#14b8a6'],['Alimentación','expense','🍽️','#f97316'],['Vivienda','expense','🏠','#6366f1'],['Transporte','expense','🚌','#0ea5e9'],['Salud','expense','💊','#ef4444'],['Entretenimiento','expense','🎬','#a855f7'],['Servicios','expense','💡','#eab308'],['Otros gastos','expense','🧾','#64748b']].map((c,i)=>({id:'c'+i,name:c[0],type:c[1],icon:c[2],color:c[3]})),tx:[]});
const dU=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)),iso=u=>new Date(u).toISOString().slice(0,10);
const addDays=(s,n)=>iso(dU(s)+n*864e5),dbt=(a,b)=>Math.round((dU(b)-dU(a))/864e5);
const addM=(s,n,day)=>{const ym=shift(s.slice(0,7),n);return ym+'-'+String(Math.min(day||+s.slice(8),lastDay(ym))).padStart(2,'0')};
const nxt=(r,s)=>r.freq==='daily'?addDays(s,1):r.freq==='weekly'?addDays(s,7):r.freq==='biweekly'?addDays(s,14):addM(s,r.freq==='yearly'?12:+r.freq.slice(1),r.day);
const FQ={daily:['Diaria',30.44],weekly:['Semanal',4.345],biweekly:['Quincenal',2.172],m1:['Mensual',1],m2:['Cada 2 meses',.5],m3:['Cada 3 meses',1/3],m6:['Cada 6 meses',1/6],yearly:['Anual',1/12]};
const num=(v,d=0)=>(Number.isFinite(+v)&&v!==''&&v!==null)?r2(+v):d,str=(v,n=60)=>String(v==null?'':v).slice(0,n),RX=/^\d{4}-\d{2}-\d{2}$/;
const dt=v=>RX.test(v)?v:today(),hx=v=>/^#[0-9a-f]{6}$/i.test(v)?v:'#64748b',sid=v=>typeof v==='string'&&/^[\w-]{1,24}$/.test(v)?v:uid();
function clean(o){const b=seed();o=o&&typeof o==='object'?o:{};const A=(x,d=[])=>Array.isArray(x)?x:d,one=(v,l,d)=>l.includes(v)?v:d;
 const bu=o.budget&&typeof o.budget==='object'?o.budget:{},cats={};Object.entries(bu.cats||{}).slice(0,200).forEach(([k,v])=>{if(num(v)>0)cats[sid(k)]=num(v)});
 return{accounts:A(o.accounts,b.accounts).slice(0,50).map(a=>({id:sid(a.id),name:str(a.name,30),icon:str(a.icon,6)||'💳',initial:num(a.initial)})),
 categories:A(o.categories,b.categories).slice(0,200).map(c=>({id:sid(c.id),type:c.type==='income'?'income':'expense',name:str(c.name,30),icon:str(c.icon,6),color:hx(c.color),archived:!!c.archived})),
 tx:A(o.tx).slice(0,50000).map(t=>({id:sid(t.id),ts:num(t.ts,Date.now()),type:one(t.type,['income','expense','transfer'],'expense'),amount:Math.abs(num(t.amount)),date:dt(t.date),acc:sid(t.acc),to:t.to?sid(t.to):undefined,cat:t.cat?sid(t.cat):undefined,desc:str(t.desc,80),rk:t.rk?str(t.rk,60):undefined,rec:t.rec?sid(t.rec):undefined,ok:!!t.ok})).filter(t=>t.amount>0),
 rec:A(o.rec).slice(0,200).map(r=>{const nx=dt(r.next);return{id:sid(r.id),name:str(r.name,40),amount:Math.abs(num(r.amount)),cat:sid(r.cat),acc:sid(r.acc),freq:one(r.freq,Object.keys(FQ),'m1'),next:nx,day:+nx.slice(8),end:RX.test(r.end)?r.end:'',remind:one(+r.remind,[0,1,3,7],0),status:one(r.status,['activo','pausado','cancelado','finalizado'],'pausado'),hist:A(r.hist).slice(-30).map(h=>({ts:num(h.ts),msg:str(h.msg,90)}))}}).filter(r=>r.amount>0),
 goals:A(o.goals).slice(0,100).map(g=>({id:sid(g.id),name:str(g.name,40),desc:str(g.desc,100),target:Math.abs(num(g.target)),saved:num(g.saved),deadline:RX.test(g.deadline)?g.deadline:'',prio:one(g.prio,['alta','media','baja'],'media'),acc:g.acc?sid(g.acc):'',plan:Math.max(0,num(g.plan)),start:dt(g.start),status:one(g.status,['activa','pausada','completada'],'activa'),contrib:A(g.contrib).slice(-2000).map(c=>({id:sid(c.id),date:dt(c.date),amount:num(c.amount)}))})).filter(g=>g.target>0),
 budget:{total:Math.max(0,num(bu.total)),cats,th:A(bu.th,[75,90,100]).map(Number).filter(x=>[50,75,90,100].includes(x)).sort((a,b)=>a-b)}}}
let S;try{S=clean(JSON.parse(localStorage.getItem(KEY)))}catch(e){S=clean(null)}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let view='panel',month=today().slice(0,7),CH=[];
const F={q:'',from:'',to:'',cat:'',type:'',acc:''};
const C={mode:'year',month,year:String(new Date().getFullYear()),from:new Date().getFullYear()+'-01-01',to:today(),ctype:'expense'};
const cat=id=>S.categories.find(c=>c.id===id)||{name:'Sin categoría',icon:'❔',color:'#94a3b8'};
const acc=id=>S.accounts.find(a=>a.id===id)||{name:'Cuenta eliminada',icon:'💳'};
const sorted=l=>l.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
const tot=l=>{let i=0,e=0;l.forEach(t=>{if(t.type==='income')i+=t.amount;else if(t.type==='expense')e+=t.amount});return{i:r2(i),e:r2(e)}};
const accBal=(a,upto)=>r2(S.tx.reduce((s,t)=>{if(upto&&t.date>upto)return s;if(t.type==='income'&&t.acc===a.id)s+=t.amount;else if(t.type==='expense'&&t.acc===a.id)s-=t.amount;else if(t.type==='transfer'){if(t.acc===a.id)s-=t.amount;if(t.to===a.id)s+=t.amount}return s},a.initial));
const row=t=>{const tr=t.type==='transfer',c=tr?{name:'Transferencia',icon:'⇄',color:'#64748b'}:cat(t.cat);
const sub=tr?esc(acc(t.acc).name)+' → '+esc(acc(t.to).name):esc(acc(t.acc).name),cl=t.type==='income'?'inc':t.type==='expense'?'exp':'',sg=t.type==='income'?'+ ':t.type==='expense'?'− ':'⇄ ';
return `<div class="row" data-edit="${t.id}"><span class="ic" style="background:${c.color}22;color:${c.color}">${c.icon}</span><span class="gr"><b>${esc(t.desc||c.name)}</b><small>${esc(c.name)} · ${sub} · ${t.date.split('-').reverse().join('/')}${t.rk?' · 🔁 '+(t.ok?'pago confirmado':'registrado'):''}</small></span><b class="${cl}">${sg}${fmt(t.amount)}</b></div>`};
const bar=(c,v,T)=>`<div><div class="bt"><span>${c.icon} ${esc(c.name)}</span><b>${fmt(v)} · ${pct(v,T)}</b></div><div class="tr"><i style="width:${T?v/T*100:0}%;background:${c.color}"></i></div></div>`;
/* modal */
const M=$('#modal'),open=h=>{M.innerHTML='<div class="dlg">'+h+'</div>';M.hidden=false},close=()=>{M.hidden=true;M.innerHTML=''};
M.onclick=e=>{if(e.target===M)close()};
const info=m=>{open(`<p>${m}</p><button class="btn" id="n">Entendido</button>`);$('#n').onclick=close};
const ask=(m,fn,b='Sí, eliminar')=>{open(`<h3>${m}</h3><p class="mu">Esta acción no se puede deshacer.</p><div class="acts"><button class="btn" id="y" style="background:var(--exp)">${b}</button><button class="ghost" id="n">Cancelar</button></div>`);$('#y').onclick=()=>{fn();close();render()};$('#n').onclick=close};
function openForm(t){
 if(!S.accounts.length)return info('Primero crea una cuenta en Ajustes → Cuentas.');
 const ed=!!(t&&t.id);t=t?{...t}:{type:'expense',date:today(),amount:'',cat:'',acc:S.accounts[0].id,to:'',desc:''};
 const op=(arr,sel)=>arr.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${x.icon} ${esc(x.name)}</option>`).join('');
 open(`<h3>${ed?'Editar':'Nuevo'} movimiento</h3><div class="seg" id="ty">${[['expense','− Gasto'],['income','+ Ingreso'],['transfer','⇄ Transferencia']].map(x=>`<button data-t="${x[0]}">${x[1]}</button>`).join('')}</div>
<label>Importe (USD)<input id="fa" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00" value="${t.amount}"></label>
<label>Fecha<input id="fd" type="date" value="${t.date}"></label>
<label id="lc">Categoría<select id="fc"></select></label>
<label><span id="la">Cuenta</span><select id="fk">${op(S.accounts,t.acc)}</select></label>
<label id="lt">Cuenta de destino<select id="fto">${op(S.accounts,t.to||(S.accounts.find(a=>a.id!==t.acc)||{}).id)}</select></label>
<label>Descripción<input id="fx" maxlength="80" placeholder="Ej.: supermercado" value="${esc(t.desc)}"></label>
${t.rk?'<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="fok" style="width:auto;min-height:0" '+(t.ok?'checked':'')+'> Pago confirmado (ya se descontó de mi cuenta)</label>':''}<p class="err" id="er"></p><div class="acts"><button class="btn" id="ok">Guardar</button><button class="ghost" id="n">Cancelar</button>${ed?'<button class="ghost dng" id="del">Eliminar</button>':''}</div>`);
 const sync=()=>{$('#ty').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===t.type));const tr=t.type==='transfer';$('#lc').hidden=tr;$('#lt').hidden=!tr;$('#la').textContent=tr?'Cuenta de origen':'Cuenta';
  $('#fc').innerHTML=S.categories.filter(c=>c.type===t.type&&(!c.archived||c.id===t.cat)).map(c=>`<option value="${c.id}" ${c.id===t.cat?'selected':''}>${c.icon} ${esc(c.name)}</option>`).join('')};
 $('#ty').querySelectorAll('button').forEach(b=>b.onclick=()=>{t.type=b.dataset.t;t.cat='';sync()});sync();
 $('#n').onclick=close;
 if(ed)$('#del').onclick=()=>ask('¿Eliminar este movimiento?',()=>{S.tx=S.tx.filter(x=>x.id!==t.id);save()});
 $('#ok').onclick=()=>{const a=r2(parseFloat($('#fa').value)),d=$('#fd').value,k=$('#fk').value,to=$('#fto').value,c=$('#fc').value,tr=t.type==='transfer',er=m=>$('#er').textContent=m;
  if(!(a>0))return er('Escribe un importe mayor que 0.');if(!d)return er('Elige una fecha.');
  if(!tr&&!c)return er('Elige una categoría (puedes crearlas en Ajustes).');if(tr&&k===to)return er('La cuenta de origen y la de destino deben ser distintas.');
  const n={id:t.id||uid(),ts:t.ts||Date.now(),type:t.type,amount:a,date:d,acc:k,desc:$('#fx').value.trim()};if(t.rk){n.rk=t.rk;n.rec=t.rec;n.ok=$('#fok').checked}if(tr)n.to=to;else n.cat=c;
  const i=S.tx.findIndex(x=>x.id===n.id);i<0?S.tx.push(n):S.tx[i]=n;if(view==='panel')month=d.slice(0,7);save();close();render()}}
const EM=['🍽️','🏠','🚌','💊','🎬','💡','💼','✨','🛒','🎓','🎁','✈️','🐾','👕','📱','💰','🧾','☕','🎮','🏋️'];
function openCat(c,type){
 const n=c?{...c}:{type,name:'',icon:EM[0],color:'#4f46e5'};
 open(`<h3>${c?'Editar':'Nueva'} categoría de ${n.type==='income'?'ingreso':'gasto'}</h3><label>Nombre<input id="cn" maxlength="30" value="${esc(n.name)}"></label><label>Color<input type="color" id="cc" value="${n.color}"></label><label>Ícono</label><div class="em">${EM.map(e=>`<button type="button" class="${e===n.icon?'on':''}">${e}</button>`).join('')}</div><p class="err" id="er"></p><div class="acts"><button class="btn" id="ok">Guardar</button><button class="ghost" id="n">Cancelar</button></div>`);
 $('.em').querySelectorAll('button').forEach(b=>b.onclick=()=>{n.icon=b.textContent;$('.em').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});
 $('#n').onclick=close;
 $('#ok').onclick=()=>{const name=$('#cn').value.trim();if(!name)return $('#er').textContent='Escribe un nombre.';const v={name,color:$('#cc').value,icon:n.icon};
  c?Object.assign(c,v):S.categories.push({id:uid(),type:n.type,...v});save();close();render()}}
function openAcc(a){
 const n=a||{name:'',initial:0};
